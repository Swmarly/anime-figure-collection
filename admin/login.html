<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="darkreader-lock" />
    <title>Admin Login · Figure Shelf</title>
    <link rel="icon" type="image/svg+xml" href="/assets/figure-icon.svg" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login" aria-labelledby="login-title">
      <section class="login-card">
        <header class="login-card__header">
          <p class="login-card__eyebrow">Private shelf access</p>
          <h1 id="login-title">Sign in to edit the shelf</h1>
          <p class="login-card__description">
            Use your admin credentials to update collection entries and image links.
          </p>
        </header>
        <p class="login-card__message" id="login-message" role="alert" hidden></p>
        <form class="login-form" id="login-form" autocomplete="off">
          <label class="login-form__field">
            <span class="login-form__label">Username</span>
            <input
              class="login-form__input"
              id="login-username"
              name="username"
              autocomplete="username"
              required
            />
          </label>
          <label class="login-form__field">
            <span class="login-form__label">Password</span>
            <input
              class="login-form__input"
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit" class="login-form__submit" id="login-submit">Sign in</button>
        </form>
      </section>
    </main>
    <script type="module" src="login.js"></script>
  </body>
</html>
